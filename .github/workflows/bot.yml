name: Bot de inversión ficticia

# Lo despierta cron-job.org cada hora con modo "auto": el bot decide qué toca según la hora de Nueva York
# (antes de abrir: preparar · bolsa abierta: operar · después del cierre: repasar · sábado: resumen).
# Los horarios de GitHub (schedule) no se usan porque llegaban con horas de retraso o no llegaban.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "Qué hacer"
        type: choice
        options: [auto, operar, repasar, preparar, semanal, prueba]
        default: auto
      forzar:
        description: "Ejecutar aunque la bolsa esté cerrada (para probar)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Elegir modo
        id: modo
        run: |
          echo "modo=${{ inputs.modo || 'auto' }}" >> "$GITHUB_OUTPUT"

      - name: Ejecutar el bot
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: |
          if [ "${{ steps.modo.outputs.modo }}" = "prueba" ]; then
            python3 bot/prueba.py
          else
            python3 bot/bot.py "${{ steps.modo.outputs.modo }}" ${{ inputs.forzar && '--forzar' || '' }}
          fi

      - name: Guardar lo que ha hecho
        run: |
          git config user.name "bot-inversion"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A bot/
          if git diff --cached --quiet; then echo "Nada que guardar"; exit 0; fi
          git commit -m "Bot: ${{ steps.modo.outputs.modo }} $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep 5
          done
          exit 1
